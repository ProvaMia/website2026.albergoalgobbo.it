    - generic [ref=f2e55]:
      - generic [ref=f2e56]:
        - heading "LA NOSTRA ACCOGLIENZA" [level=2] [ref=f2e57]
        - paragraph [ref=f2e58]: Cosa ti aspetta dal Hotel Al Gobbo
      - generic [ref=f2e60]:
        - paragraph [ref=f2e61]: Questo semplice hotel a conduzione familiare offre diverse sistemazioni con bagno privato.
        - paragraph [ref=f2e62]: Tutte le camere dell’Albergo Al Gobbo presentano mobili funzionali, freschi pavimenti piastrellati, TV e bagno completo di asciugacapelli e set di cortesia.
        - paragraph [ref=f2e63]: L’Albergo Al Gobbo propone, su richiesta, una colazione continentale servita in un accogliente saletta dedicata.
        - paragraph [ref=f2e64]: L’hotel non dispone internamente del servizio di ristorazione, ma la posizione centrale dell’hotel garantisce una ampia scelta di locali e ristornati nelle vie circostanti. Questa zona di Venezia è infatti una delle preferite dai nostri ospiti, in base alle recensioni indipendenti. Cannaregio è un’ottima scelta per i viaggiatori interessati a camminare, alla fotografia e alle passeggiate in città.
        - paragraph [ref=f2e65]: L’Albergo Al Gobbo sorge a 5 minuti a piedi dalla stazione ferroviaria di Venezia Santa Lucia. Di fronte alla stazione ferroviaria partono i vaporetti per Piazza San Marco, che vi consentiranno di raggiungerla in circa 30 minuti.
