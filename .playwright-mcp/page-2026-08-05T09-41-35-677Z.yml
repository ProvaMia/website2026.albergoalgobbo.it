        - heading "CHI SIAMO" [level=2] [ref=f1e57]
        - paragraph [ref=f1e58]: piccolo albergo a conduzione familiare
      - generic [ref=f1e74]:
        - paragraph [ref=f1e75]: Al GOBBO è un piccolo albergo a conduzione familiare dove potrete sentirvi come a casa. Situato nel cuore di Venezia, si affaccia su Campo San Geremia, a due passi dai principali terminal di arrivo/partenza quali la stazione dei treni Santa Lucia e Piazzale Roma, arrivo per auto e bus. Vicinissimo c’è l’approdo per raggiungere via acqua l’aeroporto internazionale Marco Polo. Appena fuori della porta vi troverete immersi nell’atmosfera incantata di uno dei “sestieri” della Venezia storica, “Cannaregio”, a due passi dal più antico Ghetto Ebraico d’Europa, pronti con la macchina fotografica per immortalare angoli suggestivi unici al mondo. Rialto e San Marco sono facilmente raggiungibili scoprendo Venezia a piedi oppure, utilizzando I vicini approdi di vaporetti e motoscafi, che vi potranno portare alla scoperta delle isole di Murano, Burano, Torcello e Lido.
        - paragraph [ref=f1e76]: Il nostro Albergo è stato creato dalla Signora Maria Vinco nel lontano 1930 Attualmente gestito dalla Sig.ra Sonia, la famiglia da tre generazioni non ha mai abbandonato la passione di accogliere i propri clienti come in famiglia.
