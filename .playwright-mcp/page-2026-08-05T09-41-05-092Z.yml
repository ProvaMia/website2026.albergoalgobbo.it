          - heading "ALBERGO AL GOBBO DAL 1930" [level=2] [ref=e68]
          - paragraph [ref=e69]: Nel cuore di Venezia
        - paragraph [ref=e72]: L’Albergo AL GOBBO è situato nel cuore di Venezia, con affaccio su Campo San Geremia, a due passi dai principali terminal di arrivo/partenza quali la stazione dei treni Santa Lucia e Piazzale Roma, arrivo per auto e bus. Vicinissimo c’è anche l’approdo per raggiungere via acqua l’aeroporto internazionale Marco Polo. Comodo a tutti i sistemi di trasporto ma anche ad alcune zone molto caratteristiche di Venezia, quali il famoso “getto Ebraico”, mentre con una comoda passeggiata per una delle calli principali di Venezia potrete raggiungere RIALTO e SAN MARCO.Il nostro un piccolo albergo a conduzione familiare dove potrete sentirvi come a casa. Proprio per questo uno degli aspetti a cui teniamo maggiormente è la cura del cliente e la pulizia degli ambienti e delle camere destinate ai nostri Ospiti. to ciò è testimoniato anche dal “Premio Di Servizio Eccezionale” che abbiamo ricevuto dal sito Gohotels.com sulla base dei molti commenti positivi ricevuti dai nostri clienti.
